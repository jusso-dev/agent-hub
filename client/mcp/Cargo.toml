[package]
name = "hub-mcp"
version = "0.1.0"
edition = "2021"
publish = false
description = "Stdio MCP server that exposes agent-hub as tools"

[lib]
name = "hub_mcp"
path = "src/lib.rs"

[[bin]]
name = "hub-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps mcp.json key order so payloads match client/hub.sh byte for byte.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time"] }
wiremock = "0.6"
